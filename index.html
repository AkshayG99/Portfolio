  <!-- Interactive Voronoi Canvas Background -->
  <canvas id="voronoi-canvas"></canvas>

  <!-- Interactive Controls Widget (Top Right) -->
  <div class="voronoi-controls-container" aria-label="Voronoi simulation settings">
    <div class="control-header">
      <span class="control-title">Interactive Voronoi ↗</span>
    </div>
    <div class="control-row">
      <label for="point-count-slider" class="control-label">points</label>
      <input type="range" id="point-count-slider" min="10" max="100" value="45">
    </div>
    <div class="control-row">
      <label for="relaxation-slider" class="control-label">relaxation</label>
      <input type="range" id="relaxation-slider" min="0" max="8" value="2">
    </div>
    <div class="control-row">
      <label for="speed-slider" class="control-label">speed</label>
      <input type="range" id="speed-slider" min="0" max="10" value="3">
    </div>
    <div class="control-buttons">
      <button id="regenerate-btn" class="control-btn">regenerate</button>
    </div>
    <hr class="control-divider">
    <div class="dijkstra-section">
      <div class="control-header" style="margin-top: 5px; margin-bottom: 8px;">
        <span class="control-title">Dijkstra's Maze ↗</span>
      </div>
      <div id="dijkstra-grid" class="dijkstra-grid" aria-label="Maze grid for Dijkstra visualizer"></div>
      <div class="control-buttons" style="justify-content: space-between; width: 100%; gap: 4px; margin-top: 8px;">
        <button id="dijkstra-solve-btn" class="control-btn" style="flex: 1;">solve</button>
        <button id="dijkstra-rand-btn" class="control-btn" style="flex: 1;">random</button>
        <button id="dijkstra-clear-btn" class="control-btn" style="flex: 1;">clear</button>
      </div>
    </div>
  </div>
