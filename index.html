<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Akshay Gupta | Software Engineering @ uWaterloo">
  <title>Akshay Gupta | Software Engineering @ uWaterloo</title>
  <!-- Google Fonts: Space Grotesk & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="light-mode">
  <!-- Interactive Flow Field Canvas Background -->
  <canvas id="flow-canvas"></canvas>

  <!-- Interactive Controls Widget (Top Right) -->
  <div class="flow-controls-container" aria-label="Simulation settings">
    <div class="control-header">
      <span class="control-title">Interactive Flows</span>
    </div>
    <div class="control-row">
      <label for="particle-count-slider" class="control-label">particles</label>
      <input type="range" id="particle-count-slider" min="100" max="800" value="400">
    </div>
    <div class="control-row">
      <label for="influence-slider" class="control-label">influence</label>
      <input type="range" id="influence-slider" min="1" max="10" value="5">
    </div>
    <div class="control-row">
      <label for="speed-slider" class="control-label">speed</label>
      <input type="range" id="speed-slider" min="0" max="10" value="4">
    </div>
    <div class="control-buttons">
      <button id="regenerate-btn" class="control-btn">regenerate</button>
    </div>
    <hr class="control-divider">
    <div class="dijkstra-section">
      <div class="control-header" style="margin-top: 5px; margin-bottom: 8px;">
        <span class="control-title">Dijkstra's Maze</span>
      </div>
      <div id="dijkstra-grid" class="dijkstra-grid" aria-label="Maze grid for Dijkstra visualizer"></div>
      <div class="control-buttons" style="justify-content: space-between; width: 100%; gap: 4px; margin-top: 8px;">
        <button id="dijkstra-solve-btn" class="control-btn" style="flex: 1;">solve</button>
        <button id="dijkstra-rand-btn" class="control-btn" style="flex: 1;">random</button>
        <button id="dijkstra-clear-btn" class="control-btn" style="flex: 1;">clear</button>
      </div>
    </div>
  </div>

  <main class="page-container">

        <div class="header-main-row">
          <h1 class="main-title" id="profile-name"></h1>
        </div>

        <div class="contact-row">
          <span class="profile-education" id="profile-education"></span>
          <span class="divider">|</span>
          <a href="" class="contact-link" id="resume-link" target="_blank" rel="noopener noreferrer"></a>
        </div>

        <!-- Tagline & Companion Row -->
        <div class="tagline-companion-row">

          </div>

          <!-- Virtual Companion Widget -->

            <div class="companion-character" id="companion-character" style="display: flex; gap: 4px; align-items: flex-end;">
              <!-- Robot 1 (Gold, Bounce) -->
              <div class="dance-bounce" style="display: inline-flex;">
                <svg class="robot-svg" viewBox="0 0 100 100" width="24" height="24">
                  <ellipse cx="50" cy="80" rx="15" ry="6" fill="#f59e0b" opacity="0.7" />
                  <ellipse cx="50" cy="80" rx="8" ry="3" fill="#ffffff" />
                  <rect x="25" y="30" width="50" height="40" rx="12" fill="#475569" stroke="#1e293b" stroke-width="3" />
                  <rect x="32" y="36" width="36" height="24" rx="6" fill="#0f172a" />
                  <circle cx="43" cy="48" r="3.5" fill="#22d3ee" class="eye-outer" />
                  <circle cx="43" cy="48" r="1.5" fill="#ffffff" class="eye-pupil left-pupil" />
                  <circle cx="57" cy="48" r="3.5" fill="#22d3ee" class="eye-outer" />
                  <circle cx="57" cy="48" r="1.5" fill="#ffffff" class="eye-pupil right-pupil" />
                  <path d="M 39 48 Q 43 51, 47 48" stroke="#22d3ee" stroke-width="2" fill="none" class="sleeping-eye left-sleeping-eye" style="display:none;" />
                  <path d="M 53 48 Q 57 51, 61 48" stroke="#22d3ee" stroke-width="2" fill="none" class="sleeping-eye right-sleeping-eye" style="display:none;" />

                  <circle cx="50" cy="15" r="4.5" fill="#ef4444" />
                  <path d="M 18 45 C 10 40, 10 50, 18 50 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="2" />
                  <path d="M 82 45 C 90 40, 90 50, 82 50 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="2" />
                </svg>
              </div>
              <!-- Robot 2 (Grey, Sway) -->

                  <path d="M 28 45 L 16 45 Q 12 40, 16 35" stroke="#1e293b" stroke-width="2" fill="none" />
                  <path d="M 72 45 L 84 45 Q 88 40, 84 35" stroke="#1e293b" stroke-width="2" fill="none" />
                </svg>
              </div>
              <!-- Robot 5 (Teal Sphere, Roll) -->
              <div class="dance-roll" style="display: inline-flex;">
                <svg class="robot-svg" viewBox="0 0 100 100" width="24" height="24">
                  <circle cx="50" cy="62" r="24" fill="#cbd5e1" stroke="#1e293b" stroke-width="3" />

                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="header-headshot-col">
        <img src="/headshot.jpg" alt="Akshay Gupta Headshot" class="header-headshot">
      </div>
    </header>
